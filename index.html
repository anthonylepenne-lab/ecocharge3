<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1D5C43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>EcoCharge T03 - Pro</title>
  <style>
    :root {
      /* Professional Eco Palette */
      --color-primary: #1D5C43; /* Forest Green */
      --color-primary-light: #F0F5F2; /* Soft Green tint for backgrounds */
      --color-primary-border: #C8DCD1; 
      --color-accent: #DAAA00; /* Sophisticated Amber for medium results */
      --color-text-main: #2D3748; /* Deep Charcoal */
      --color-text-muted: #718096; /* Steel Grey */
      --color-bg-app: #F7F5F2; /* Subtle Sand/Putty */
      --color-danger: #A62A21; /* Professional Red */
      --color-danger-light: #FFF5F4;
      --color-white: #FFFFFF;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(29,92,67,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--color-bg-app); color: var(--color-text-main); min-height: 100vh; -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
    
    /* Global Container to allow for max-width on desktop */
    .app-container { max-width: 500px; margin: 0 auto; min-height: 100vh; position: relative; }

    /* --- Header & Navigation --- */
    .header { background: var(--color-white); border-bottom: 1px solid var(--color-primary-border); padding: 16px 20px 0; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
    .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .app-title { font-size: 22px; font-weight: 700; color: var(--color-primary); letter-spacing: -0.5px; }
    .app-title span { color: var(--color-text-main); font-weight: 400; }
    .badge { font-size: 11px; background: var(--color-primary-light); color: var(--color-primary); border: 1px solid var(--color-primary-border); padding: 4px 12px; border-radius: 99px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    
    /* Car Banner - Environmental focus */
    .car-banner { background: var(--color-primary); color: var(--color-white); border-radius: 12px; margin: 0 0 12px; padding: 18px; display: flex; align-items: center; justify-content: space-between; border: none; box-shadow: var(--shadow-md); position: relative; overflow: hidden;}
    .car-banner::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.04)" fill-opacity="1" d="M0,192L60,186.7C120,181,240,171,360,181.3C480,192,600,224,720,224C840,224,960,192,1080,165.3C1200,139,1320,117,1380,106.7L1440,96L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path></svg>') bottom; background-size: cover;}

    .jeep-info { display: flex; flex-direction: column; align-items: flex-start; z-index: 1;}
    .car-info { display: flex; flex-direction: column; align-items: flex-end; text-align: right; z-index: 1;}
    .car-brand { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .car-model { font-size: 24px; font-weight: 800; color: var(--color-white); letter-spacing: -1px;}
    .car-spec { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }

    /* SVG Vehicle styles */
    .vehicle-svg { position: relative; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); z-index: 1;}

    .tabs { display: flex; gap: 4px; padding-bottom: 0; }
    .tab { flex: 1; padding: 12px 2px; text-align: center; font-size: 12px; font-weight: 600; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--color-text-muted); border: none; background: transparent; font-family: inherit; transition: all 0.15s ease; }
    .tab.active { background: var(--color-bg-app); color: var(--color-primary); border-bottom: 3px solid var(--color-primary); }

    /* --- Content --- */
    .content { padding: 8px 16px 40px; }
    .page { display: none; }
    .page.active { display: block; }
    
    /* Section Labels */
    .slabel { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--color-text-muted); text-transform: uppercase; margin: 20px 0 8px 4px; display: flex; align-items: center; gap: 6px;}
    .slabel::before { content:''; display:inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--color-primary-border);}

    /* Card Styling - Professional */
    .card { background: var(--color-white); border: 1px solid var(--color-primary-border); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--color-primary-light); }
    .card-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--color-white); }
    .card-lbl { font-size: 14px; font-weight: 700; color: var(--color-text-main);}
    
    /* Input Fields */
    .field { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-primary-light); }
    .field:last-child { border-bottom: none; }
    .flabel { font-size: 14px; color: var(--color-text-main); font-weight: 500; }
    .fright { display: flex; align-items: center; gap: 8px; }
    
    .field input[type=number], .field input[type=text] { width: 110px; text-align: right; background: var(--color-primary-light); border: 1px solid var(--color-primary-border); color: var(--color-text-main); font-size: 15px; font-weight: 600; border-radius: 8px; padding: 8px 12px; -webkit-appearance: none; appearance: none; font-family: inherit; transition: all 0.2s;}
    .field input[type=text] { width: 160px; text-align: left; }
    .field input[type=date] { background: var(--color-primary-light); border: 1px solid var(--color-primary-border); color: var(--color-text-main); font-size: 14px; font-weight: 600; border-radius: 8px; padding: 8px 12px; font-family: inherit; -webkit-appearance: none; }
    .field input:focus { outline: none; border-color: var(--color-primary); background: var(--color-white); box-shadow: 0 0 0 3px rgba(29,92,67,0.1); }
    .unit { font-size: 12px; color: var(--color-text-muted); font-weight: 500; min-width: 60px; }

    /* Buttons */
    .btn { width: 100%; padding: 16px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; margin-top: 8px; font-family: inherit; transition: all 0.2s ease; display: block; text-align: center; box-shadow: var(--shadow-sm);}
    .btn-blue { background: var(--color-primary); color: var(--color-white); }
    .btn-blue:hover { background: #134531; }
    .btn-blue:active { background: #0b3021; transform: translateY(1px); box-shadow: none; }
    
    .btn-outline { background: var(--color-white); color: var(--color-primary); border: 1.5px solid var(--color-primary); margin-top: 16px; }
    .btn-outline:active { background: var(--color-primary-light); }
    
    .btn-danger { background: var(--color-danger-light); color: var(--color-danger); border: 1px solid #FFCFCF; margin-top: 16px; }
    .btn-danger:active { background: #FFE8E6; }

    /* --- Results Styling --- */
    .hero { background: var(--color-white); border: 2px solid var(--color-primary); border-radius: 16px; padding: 24px 20px; text-align: center; color: var(--color-primary); margin: 10px 0; box-shadow: var(--shadow-md); }
    .hero-lbl { font-size: 12px; font-weight: 600; opacity: 0.8; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
    .hero-val { font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: var(--color-text-main); }
    .hero-sub { font-size: 13px; color: var(--color-text-muted); margin-top: 10px; }

    .period-info { background: var(--color-primary-light); border: 1px solid var(--color-primary-border); border-radius: 10px; padding: 14px; margin-bottom: 12px; text-align: center; }
    .period-info .pi-dates { font-size: 14px; font-weight: 700; color: var(--color-primary); }
    .period-info .pi-days { font-size: 12px; color: var(--color-text-muted); margin-top: 3px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    
    .metric { background: var(--color-white); border: 1px solid var(--color-primary-border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-sm); }
    .metric-ico { font-size: 20px; margin-bottom: 8px; }
    .metric-lbl { font-size: 11px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
    .metric-val { font-size: 20px; font-weight: 800; color: var(--color-text-main); }
    .metric-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 3px; }

    .detail { background: var(--color-white); border: 1px solid var(--color-primary-border); border-radius: 12px; padding: 4px 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .drow { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 14px; border-bottom: 1px solid var(--color-primary-light); }
    .drow:last-child { border-bottom: none; }
    .dkey { color: var(--color-text-muted); font-weight: 500; }
    .dval { font-weight: 700; color: var(--color-text-main); }
    
    /* Projections */
    .proj { background: var(--color-white); border: 1px solid var(--color-primary-border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .prow { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--color-primary-light); }
    .prow:last-child { border-bottom: none; }
    .plbl { font-size: 14px; color: var(--color-text-main); font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .pdot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .pval { font-size: 20px; font-weight: 800; }

    /* Chart */
    .chart-wrap { background: var(--color-white); border: 1px solid var(--color-primary-border); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .chart-title { font-size: 13px; font-weight: 700; color: var(--color-text-main); margin-bottom: 16px; text-align: center;}
    .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 100px; padding: 0 10px;}
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar { width: 100%; border-radius: 6px 6px 0 0; transition: height 0.4s ease-out; min-height: 8px; max-width: 60px;}
    .bar-lbl { font-size: 10px; color: var(--color-text-muted); font-weight: 600; text-align: center; margin-top: 4px;}
    .bar-val { font-size: 10px; font-weight: 700; text-align: center; }

    /* State colors */
    .bg-ess { background-color: var(--color-danger) !important; }
    .bg-elec { background-color: var(--color-primary) !important; }
    .c-ess { color: var(--color-danger); }
    .c-elec { color: var(--color-primary); }
    .c-green { color: #2D8A3F; }
    .c-amber { color: var(--color-accent); }

    /* --- History & Settings --- */
    .hist-hero { background: var(--color-white); border: 1px solid var(--color-primary-border); border-radius: 16px; padding: 20px; color: var(--color-text-main); margin: 16px 0 12px; box-shadow: var(--shadow-md); text-align: center;}
    .hh-lbl { font-size: 12px; color: var(--color-text-muted); letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
    .hh-val { font-size: 38px; font-weight: 800; margin: 4px 0; color: var(--color-primary); letter-spacing: -1.5px;}
    .hh-sub { font-size: 13px; color: var(--color-text-muted); }
    
    .hist-item { background: var(--color-white); border: 1px solid var(--color-primary-border); border-radius: 10px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); cursor: pointer; transition: background 0.1s; -webkit-user-select: none; user-select: none; }
    .hist-item:active { background: var(--color-primary-light); }
    .hi-left { display: flex; flex-direction: column; gap: 3px; }
    .hi-date { font-size: 13px; font-weight: 500; color: var(--color-text-muted); }
    .hi-title { font-size: 13px; color: var(--color-text-main); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .hi-sub { font-size: 11px; color: var(--color-text-muted); }
    .hi-eco { font-size: 18px; font-weight: 800; color: var(--color-primary); text-align: right;}
    .empty { text-align: center; padding: 60px 20px; color: var(--color-text-muted); font-size: 14px; line-height: 1.5;}

    .set-hero { background: var(--color-white); border-left: 5px solid var(--color-accent); border-radius: 8px; padding: 16px; margin: 16px 0 6px; box-shadow: var(--shadow-sm); border-top: 1px solid var(--color-primary-border); border-right: 1px solid var(--color-primary-border); border-bottom: 1px solid var(--color-primary-border);}
    .set-title { font-size: 18px; font-weight: 700; color: var(--color-text-main);}
    .set-sub { font-size: 13px; color: var(--color-text-muted); margin-top: 3px; }

    /* Toast */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(13, 33, 55, 0.9); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); color: var(--color-white); font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: 99px; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); z-index: 999; white-space: nowrap; font-family: inherit; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .err { color: var(--color-danger); font-size: 13px; padding: 10px 4px; display: none; font-weight: 500;}
  
    /* Icons overrides to be more professional */
    .ico-ess { color: var(--color-white); background-color: var(--color-danger); border-radius: 6px; padding: 4px; font-size: 14px; font-style: normal;}
    .ico-elec { color: var(--color-white); background-color: var(--color-primary); border-radius: 6px; padding: 4px; font-size: 14px; font-style: normal;}
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="header-row">
      <div class="app-title">Eco<span>Charge</span></div>
      <span class="badge">T03 Edition</span>
    </div>
    <div class="car-banner">
      <div class="jeep-info">
        <svg class="vehicle-svg" width="60" height="30" viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 35 L15 15 Q18 10 25 10 L75 10 Q82 10 85 15 L90 35 Q92 40 90 42 L10 42 Q8 40 10 35Z" fill="#F0F0F0" stroke="#DDDDDD" stroke-width="1"/>
          <path d="M22 13 L78 13 Q82 13 83 16 L88 33 Q89 36 86 36 L14 36 Q11 36 12 33 L17 16 Q18 13 22 13Z" fill="#333333"/>
          <ellipse cx="25" cy="42" rx="10" ry="10" fill="#111111"/>
          <ellipse cx="25" cy="42" rx="5" ry="5" fill="#333333"/>
          <ellipse cx="75" cy="42" rx="10" ry="10" fill="#111111"/>
          <ellipse cx="75" cy="42" rx="5" ry="5" fill="#333333"/>
          <rect x="5" y="25" width="8" height="12" rx="1" fill="#FFFFFF" opacity="0.9"/>
          <rect x="87" y="25" width="8" height="12" rx="1" fill="#FFFFFF" opacity="0.9"/>
          <rect x="40" y="38" width="20" height="2" rx="1" fill="#DDDDDD"/>
        </svg>
        <div class="car-spec">VS Jeep Renegade (Thermique)</div>
      </div>
      
      <div class="car-info">
        <div class="car-brand">Leapmotor</div>
        <div class="car-model">T03</div>
        <div class="car-spec">Électrique &middot; 265 km (WLTP)</div>
        <svg class="vehicle-svg" width="60" height="30" viewBox="0 0 130 62" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="65" cy="59" rx="48" ry="3.5" fill="rgba(0,0,0,0.15)"/>
          <path d="M16 46 L16 35 Q18 29 26 25 L40 19 Q50 15 65 15 Q80 15 90 19 L104 25 Q112 29 114 35 L114 46 Q114 51 110 52 L20 52 Q16 51 16 46Z" fill="#F0F0F0" stroke="#DDDDDD" stroke-width="0.5"/>
          <path d="M38 25 Q48 16 65 15 Q82 15 92 25 L100 33 L30 33Z" fill="#333333"/>
          <path d="M105 35 L114 37 L114 40 L105 38Z" fill="#FFE082" opacity="0.9"/>
          <path d="M25 35 L16 37 L16 40 L25 38Z" fill="#EF5350" opacity="0.85"/>
          <ellipse cx="93" cy="53" rx="11" ry="7" fill="#1A1A1A"/>
          <ellipse cx="93" cy="53" rx="4.5" ry="3" fill="#666666"/>
          <ellipse cx="37" cy="53" rx="11" ry="7" fill="#1A1A1A"/>
          <ellipse cx="37" cy="53" rx="4.5" ry="3" fill="#666666"/>
        </svg>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('calcul')">Calcul</button>
      <button class="tab" onclick="switchTab('periode')">Période</button>
      <button class="tab" onclick="switchTab('historique')">Historique</button>
      <button class="tab" onclick="switchTab('reglages')">Réglages</button>
    </div>
  </div>

  <div class="content">

    <div class="page active" id="page-calcul">
      <div class="slabel">Trajet du jour</div>
      <div class="card">
        <div class="field">
          <span class="flabel">Nom du trajet (optionnel)</span>
          <div class="fright"><input type="text" id="km_name" placeholder="ex: Maison-Travail"></div>
        </div>
        <div class="field">
          <span class="flabel">Distance parcourue</span>
          <div class="fright"><input type="number" id="km" value="50" min="0" inputmode="decimal"><span class="unit">km</span></div>
        </div>
      </div>
      <div class="slabel">Ancienne voiture</div>
      <div class="card">
        <div class="card-head">
          <div class="card-icon" style="background:var(--color-danger);"><i class="ico-ess">⛽</i></div>
          <span class="card-lbl" style="color:var(--color-danger);">Thermique - Essence</span>
        </div>
        <div class="field">
          <span class="flabel">Consommation moyenne</span>
          <div class="fright"><input type="number" id="conso_ess" value="7" min="0" step="0.1" inputmode="decimal"><span class="unit">L/100km</span></div>
        </div>
        <div class="field">
          <span class="flabel">Prix du carburant</span>
          <div class="fright"><input type="number" id="prix_ess" value="1.85" min="0" step="0.01" inputmode="decimal"><span class="unit">€/L</span></div>
        </div>
      </div>
      <div class="slabel">Leapmotor T0
